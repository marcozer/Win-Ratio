[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WinRatioPy"
version = "0.2.0"
description = "Win ratio, generalized pairwise comparisons, design diagnostics, matching, weighting, and cluster-aware inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Marc-Anthony Chouillard" },
]
keywords = ["statistics", "win ratio", "clinical outcomes", "hierarchical composite endpoint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/marcozer/Win-Ratio"
Repository = "https://github.com/marcozer/Win-Ratio"
Issues = "https://github.com/marcozer/Win-Ratio/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
docs = [
  "mkdocs>=1.6",
]
study = [
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
